databaseChangeLog:
  - changeSet:
      id: 03-create-comments-table
      author: elliansss
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: pk
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_user
                    references: users(id)
                    onDelete: CASCADE
              - column:
                  name: ads_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comments_ads
                    references: ads(pk)
                    onDelete: CASCADE

        - createIndex:
            tableName: comments
            columns:
              - column:
                  name: ads_id
            indexName: idx_comments_ads_id

        - createIndex:
            tableName: comments
            columns:
              - column:
                  name: user_id
            indexName: idx_comments_user_id

        - createIndex:
            tableName: comments
            columns:
              - column:
                  name: created_at
            indexName: idx_comments_created_at